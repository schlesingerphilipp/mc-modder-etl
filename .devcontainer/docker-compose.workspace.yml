version: '3.3'

services:
  workspace:
    build: .
    tty: true
    working_dir: /home/vscode/workspace
    volumes:
      - ~/.ssh/:/home/vscode/.ssh/
      - ..:/home/vscode/workspace
      - ../../mods:/mods
      - ../../assets:/assets
      - $HOME/private/dbvolume:/var/db
    environment:
      - OLLAMA_SERVER_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b-instruct-q4_0
      - LOG_LEVEL=DEBUG
      - DB_PATH=/var/db/
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - $HOME/private/dbvolume/chroma:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
