version: '3.3'

services:
  workspace:
    build: .
    tty: true
    working_dir: /home/vscode/workspace
    volumes:
      - ~/.ssh/:/home/vscode/.ssh/
      - ..:/home/vscode/workspace
      - ../../mods:/mods
      - ../../assets:/assets
      - $HOME/private/dbvolume:/var/db
    environment:
      - LOG_LEVEL=DEBUG
      - DB_PATH=/var/db/
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      # LM Studio summarizer config
      - LMSTUDIO_BASE_URL=http://host.docker.internal:1234/v1
      - LMSTUDIO_API_KEY=not-needed
      - LMSTUDIO_MODEL=gpt-oss-20b
      - DISABLE_THINKING=true
      - MAX_COMPLETION_TOKENS=120000
      # Embedding config (uses LM Studio)
      - EMBEDDING_BASE_URL=http://host.docker.internal:1234/v1
      - EMBEDDING_MODEL=text-embedding-nomic-embed-text-v1.5
      - EMBEDDING_API_KEY=not-needed

  chromadb:
    image: chromadb/chroma:latest
    volumes:
      - $HOME/private/dbvolume/chroma:/chroma/chroma
    ports:
      - "8000:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
